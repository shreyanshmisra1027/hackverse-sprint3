<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Network — WebRTC File Transfer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0c4a6e;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: #7dd3fc;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: #fca5a5;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* State badge */
    .state-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .state-idle      { background: #374151; color: #9ca3af; }
    .state-signaling { background: #7c3aed; color: #fff; }
    .state-connecting { background: #f59e0b; color: #000; }
    .state-connected  { background: var(--success); color: #000; }
    .state-reconnecting { background: #f59e0b; color: #000; }
    .state-failed     { background: var(--danger); color: #fff; }
    .state-closed     { background: #6b7280; color: #fff; }

    /* Peer list */
    .peer-list {
      list-style: none;
    }

    .peer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .peer-item .name {
      font-weight: 600;
    }

    .peer-item .status {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 0.5rem 0;
      display: none;
    }

    .progress-track.active { display: block; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 4px;
      transition: width 0.2s;
      width: 0%;
    }

    .stats {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-label {
      display: block;
      text-align: center;
      padding: 0.75rem;
      background: var(--accent-dim);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .file-input-label:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .file-input-label.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    #toastContainer {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      animation: slideIn 0.3s ease-out;
      max-width: 320px;
    }

    .toast.success { border-color: var(--success); }
    .toast.error   { border-color: var(--danger); }
    .toast.info    { border-color: var(--accent); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(1rem); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>⚡ P2P Network</h1>
  <p class="subtitle">WebRTC-based peer-to-peer file transfer</p>

  <!-- Connection -->
  <div class="card">
    <h2>🔗 Connection</h2>
    <label for="peerIdInput">Your Peer ID</label>
    <input id="peerIdInput" type="text" placeholder="Enter a unique peer ID" />
    <label for="signalingUrl">Signaling Server URL</label>
    <input id="signalingUrl" type="text" value="http://localhost:3000" />
    <label for="targetPeer">Target Peer to Connect</label>
    <select id="targetPeer">
      <option value="">— Select a peer —</option>
    </select>
    <div class="btn-row">
      <button id="connectBtn" class="btn-primary">Join LAN</button>
      <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
    </div>
    <div style="margin-top: 0.75rem;">
      State: <span id="stateBadge" class="state-badge state-idle">idle</span>
    </div>
  </div>

  <!-- Peers -->
  <div class="card">
    <h2>👥 Peers</h2>
    <ul id="peerList" class="peer-list">
      <li style="color: var(--muted); font-size: 0.85rem;">No peers connected yet</li>
    </ul>
  </div>

  <!-- Transfer -->
  <div class="card">
    <h2>📁 File Transfer</h2>
    <div class="file-input-wrapper">
      <div id="fileLabel" class="file-input-label disabled">
        Select a file to send (enable connection first)
      </div>
      <input id="fileInput" type="file" disabled />
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="stats" id="transferStats"></div>
  </div>

  <!-- Received files -->
  <div class="card">
    <h2>📥 Received Files</h2>
    <div id="receivedFiles">
      <p style="color: var(--muted); font-size: 0.85rem;">No files received yet</p>
    </div>
  </div>

  <script src="app-bundle.js"></script>
</body>
</html>
