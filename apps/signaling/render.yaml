# In Render: New > Blueprint, select this file as the Blueprint Path.
services:
  - type: web
    name: p2p-signaling
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render asks for this value during initial Blueprint setup. Enter the
      # exact Vercel production and preview origins once a frontend exists.
      - key: ALLOWED_ORIGINS
        sync: false
